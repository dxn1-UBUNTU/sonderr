# sonderr_change - new file
name: "Setup Sonderr"
description: "Install Sonderr CLI globally"
runs:
  using: "composite"
  steps:
    - name: Install Sonderr CLI
      run: curl -fsSL https://kilo.ai/cli/install | bash
      shell: bash

    - name: Add Sonderr to PATH
      run: echo "$HOME/.sonderr/bin" >> $GITHUB_PATH
      shell: bash
