<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonderr Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-2: #27272a;
      --border: #3f3f46;
      --text: #fafafa;
      --text-dim: #a1a1aa;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: row-reverse;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: var(--accent); }
    .version {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: monospace;
    }
    .sidebar-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .status-label { color: var(--text-dim); }
    .status-value { font-weight: 500; font-family: monospace; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.warning { background: var(--warning); }
    .status-dot.error { background: var(--error); }
    .sidebar-footer {
      padding: 16px 20px;
      margin-top: auto;
      border-top: 1px solid var(--border);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-header h2 { font-size: 16px; font-weight: 600; }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 24px;
    }
    .hero {
      text-align: center;
      max-width: 480px;
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(to right, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .launch-btn {
      padding: 14px 28px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .launch-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .secondary-actions {
      display: flex;
      gap: 10px;
    }
    .secondary-btn {
      padding: 10px 16px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .secondary-btn:hover { background: var(--border); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">Sonderr <span>Desktop</span></div>
      <div class="version" id="app-version">v1.0.3</div>
    </div>

    <div class="sidebar-section">
      <h3>Status</h3>
      <div class="status-item">
        <span class="status-label">Gateway</span>
        <span class="status-value"><span class="status-dot"></span>Online</span>
      </div>
      <div class="status-item">
        <span class="status-label">Provider</span>
        <span class="status-value" id="provider-value">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">Model</span>
        <span class="status-value" id="model-value">—</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Session</h3>
      <div class="status-item">
        <span class="status-label">Chat</span>
        <span class="status-value" id="chat-name">default</span>
      </div>
      <div class="status-item">
        <span class="status-label">Cache</span>
        <span class="status-value" id="cache-status">empty</span>
      </div>
      <div class="status-item">
        <span class="status-label">Usage</span>
        <span class="status-value" id="usage-status">0 msgs</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="status-item">
        <span class="status-label">Build</span>
        <span class="status-value" id="build-version">v1.0.3</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <h2>Dashboard</h2>
    </header>
    <div class="main-content">
      <div class="hero">
        <h1>Your AI coding agent.</h1>
        <p>Edit files, run commands, and ship code from one window. Press launch to open the agent terminal.</p>
      </div>
      <button class="launch-btn" id="launch-btn">Launch Agent</button>
      <div class="secondary-actions">
        <button class="secondary-btn" id="reattach-btn">Attach New Key</button>
        <button class="secondary-btn" id="reset-btn">Reset Setup</button>
      </div>
    </div>
  </main>

    <script>
      async function loadConfig() {
        try {
          const config = await window.sonderr.readConfig();
          if (config) {
            document.getElementById('provider-value').textContent = config.provider || '—';
            document.getElementById('model-value').textContent = config.model || '—';
          }
        } catch (e) {
          console.error('Failed to load config:', e);
        }
      }

      document.getElementById('launch-btn').addEventListener('click', async () => {
        try {
          const result = await window.sonderr.launchTerminal();
          if (result.error) alert('Failed to launch terminal: ' + result.error);
        } catch (e) {
          alert('Failed to launch terminal: ' + e.message);
        }
      });

      document.getElementById('reattach-btn').addEventListener('click', async () => {
        try {
          await window.sonderr.openExternal('http://localhost:17381/setup');
        } catch (e) {
          console.error('Failed to open wizard:', e);
        }
      });

      document.getElementById('reset-btn').addEventListener('click', async () => {
        if (confirm('Reset all settings? This will delete your API key.')) {
          try {
            await window.sonderr.saveConfig(null);
            loadConfig();
          } catch (e) {
            alert('Failed to reset: ' + e.message);
          }
        }
      });

      loadConfig();
    </script>
</body>
</html>
